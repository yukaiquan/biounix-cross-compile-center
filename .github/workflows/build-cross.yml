name: BioUnix Cross Build

on:
  workflow_dispatch:
    inputs:
      software:
        description: '软件名称'
        required: true
        default: 'poplddecay'
      version:
        description: '软件版本'
        required: true
        default: 'v3.43'
      platform:
        description: '目标平台'
        required: true
        default: 'all'
        type: choice
        options: [all, linux-x64, linux-arm64, macos-x64, macos-arm64, windows-x64]

  workflow_call:
    inputs:
      software:
        required: true
        type: string
      version:
        required: true
        type: string
      platform:
        required: true
        type: string

jobs:
  # --- 任务 1: 动态计算矩阵 ---
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          # 每一个组合都必须包含 mshell，否则 shell: ${{ matrix.mshell }} 会报错
          ALL_PLATFORMS='{
            "include": [
              {"id": "linux-x64",   "os-type": "linux",   "arch": "x64",   "runner": "ubuntu-latest",     "mshell": "bash"},
              {"id": "linux-arm64", "os-type": "linux",   "arch": "arm64", "runner": "ubuntu-24.04-arm", "mshell": "bash"},
              {"id": "macos-arm64", "os-type": "macos",   "arch": "arm64", "runner": "macos-14",         "mshell": "bash"},
              {"id": "macos-x64",   "os-type": "macos",   "arch": "x64",   "runner": "macos-15-intel",   "mshell": "bash"},
              {"id": "windows-x64", "os-type": "windows", "arch": "x64",   "runner": "windows-latest",   "mshell": "msys2 {0}"}
            ]
          }'
          
          if [[ "${{ inputs.platform }}" == "all" ]]; then
            RESULT=$(echo "$ALL_PLATFORMS" | jq -c .)
          else
            RESULT=$(echo "$ALL_PLATFORMS" | jq -c --arg ID "${{ inputs.platform }}" '.include |= map(select(.id == $ID))')
          fi
          echo "matrix=$RESULT" >> $GITHUB_OUTPUT

  # --- 任务 2: 执行编译 ---
  build:
    needs: setup
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    defaults:
      run:
        # 现在所有矩阵项都有 mshell 字段了
        shell: ${{ matrix.mshell }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 关键：物理隔离，确保每个 Job 开始前 dist 目录是空的
      - name: Hard Reset
        shell: bash
        run: |
          rm -rf dist build sources build_env.txt
          mkdir -p dist/bin

      - name: Setup D Language
        if: inputs.software == 'sambamba'
        uses: dlang-community/setup-dlang@v1
        with:
          compiler: ldc-1.28.1

      - name: Setup MSYS2 (Windows Only)
        if: matrix.os-type == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path_type: inherit
          install: >-
            base-devel mingw-w64-x86_64-gcc mingw-w64-x86_64-zlib mingw-w64-x86_64-gcc-fortran mingw-w64-x86_64-openblas mingw-w64-x86_64-lz4 

      # 关键改动：强制将矩阵中的系统类型写进环境变量，覆盖脚本的自测
      - name: Prepare Environment
        run: |
          # 跳过 megahit 的 Windows 构建（不兼容）
          if [[ "${{ matrix.os-type }}" == "windows" ]] && [[ "${{ inputs.software }}" == "megahit" ]]; then
            echo "SKIP_WINDOWS=true" >> $GITHUB_ENV
          else
            echo "SKIP_WINDOWS=false" >> $GITHUB_ENV
          fi
          
          echo "S_NAME=${{ inputs.software }}" >> $GITHUB_ENV
          echo "S_VER=${{ inputs.version }}" >> $GITHUB_ENV
          echo "OS_TYPE=${{ matrix.os-type }}" >> $GITHUB_ENV
          echo "ARCH_TYPE=${{ matrix.arch }}" >> $GITHUB_ENV
          # --- 专门为 Sambamba 在 Windows 下寻找编译器 ---
          if [ "${{ matrix.os-type }}" == "windows" ] && [ "${{ inputs.software }}" == "sambamba" ]; then
             # setup-dlang 会设置 DC 变量，我们捕获它的绝对路径并转为 MSYS2 风格
             LDC_RAW_PATH=$(which ldc2 || echo "$DC")
             # 转换为 /c/ 这种格式
             LDC_POSIX_PATH=$(cygpath -u "$LDC_RAW_PATH")
             echo "LDC_FORCED_PATH=$LDC_POSIX_PATH" >> $GITHUB_ENV
          fi

          if [ "${{ matrix.os-type }}" == "windows" ]; then
            echo "EXE_EXT=.exe" >> $GITHUB_ENV
          else
            echo "EXE_EXT=" >> $GITHUB_ENV
          fi

      - name: Locate LDC for Windows
        if: matrix.os-type == 'windows' && inputs.software == 'sambamba'
        shell: powershell
        run: |
          # 1. 找到 ldc2.exe 的绝对路径
          $ldcPath = (Get-Command ldc2.exe).Source
          # 2. 转换为 MSYS2 识别的路径格式 (例如 C:\... -> /c/...)
          $posixPath = $ldcPath.Replace('\', '/').Replace('C:', '/c').Replace('c:', '/c')
          # 3. 写入当前目录下的临时文件
          $posixPath | Out-File -FilePath "ldc_full_path.txt" -Encoding ascii
          Write-Host "LDC Absolute Path Found: $posixPath"

      - name: Skip Windows for incompatible software
        run: |
          if [ "$SKIP_WINDOWS" == "true" ]; then
            echo "Skipping Windows build for $S_NAME (not supported)"
            exit 0
          fi

      - name: Install Dependencies
        run: bash scripts/install_deps.sh ${{ env.S_NAME }} ${{ env.S_VER }}

      - name: Fetch Source
        run: |
          bash scripts/fetch_source.sh ${{ env.S_NAME }} ${{ env.S_VER }}
          if [ -f "build_env.txt" ]; then cat build_env.txt >> $GITHUB_ENV; fi

      - name: Build
        run: |
          source config/global.env
          # 二次强制导出，确保交叉编译环境 100% 正确
          export OS_TYPE="${{ matrix.os-type }}"
          export ARCH_TYPE="${{ matrix.arch }}"
          if [ -f build_env.txt ]; then source build_env.txt; fi
          bash softwares/${{ env.S_NAME }}/${{ env.S_VER }}/build.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.S_NAME }}-${{ env.S_VER }}-${{ matrix.id }}
          path: dist/bin/
          retention-days: 7
